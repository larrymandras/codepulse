name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (full history) is required because
      # requirementsDrift.ratchet.test.ts resolves a phase's completion commit by
      # bisecting ROADMAP.md's own revision history and compares stamp ancestry
      # against it (`git merge-base --is-ancestor`). A depth-1 checkout leaves that
      # unanswerable.
      #
      # Measured 2026-08-27, stated precisely because the obvious stronger claim is
      # NOT true today: with zero in-range `Partial` rows, the ratchet's
      # shallow-repository branch is never REACHED, so in a shallow clone it does not
      # fire. What actually goes red there is completionCommitFor's own bisect test.
      # The shallow branch becomes load-bearing the moment a real in-range Partial
      # appears (verified by injecting one into a real depth-1 clone). Keeping this
      # flag is what makes that future case answerable rather than indeterminate.
      #
      # Guarded by the "CI reachability" test in requirementsDrift.ratchet.test.ts,
      # which parses this file; before that existed, deleting this line was silent.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit
      - run: npx vite build
      # The two projects run SEQUENTIALLY and the second is scoped to `unit`.
      # A bare `npx vitest run` here would re-run the browser project a second
      # time AND run it concurrently with the jsdom workers. Measured 2026-08-26:
      # at the same commit, in the same worktree, `--project unit` passed 10/10
      # while both-projects-together failed on iteration 1. The browser project is
      # required to reproduce the instability; unit-only never showed it.
      - run: npx vitest run --project browser
      - run: npx vitest run --project unit
