name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit
      - run: npx vite build
      # The two projects run SEQUENTIALLY and the second is scoped to `unit`.
      # A bare `npx vitest run` here would re-run the browser project a second
      # time AND run it concurrently with the jsdom workers. Measured 2026-08-26:
      # at the same commit, in the same worktree, `--project unit` passed 10/10
      # while both-projects-together failed on iteration 1. The browser project is
      # required to reproduce the instability; unit-only never showed it.
      - run: npx vitest run --project browser
      - run: npx vitest run --project unit
